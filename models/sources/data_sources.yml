sources:
  - name: data_sources
    database: dbt_project_sept_2026
    schema: landing
    tables:
      - name: orders
        config: 
          freshness:
            warn_after:
              count: 365
              period: day
            error_after:
              count: 4000
              period: day
            loaded_at_field: created_at

        columns:
          - name: id
            data_tests:
              - unique:
                  config:
                    severity: warn
              - not_null:
                  config:
                    severity: warn
          
      - name: reviews
        columns:
          - name: id
            data_tests:
              - unique:
                  config:
                    severity: warn
              - not_null:
                  config:
                    severity: warn              

      - name: products
        columns:
          - name: id
            data_tests:
              - unique:
                  config:
                    severity: warn
              - not_null:
                  config:
                    severity: warn

              
      - name: users
        columns:
          - name: id
            data_tests:
              - unique:
                  config:
                    severity: warn
              - not_null:
                  config:
                    severity: warn
      - name: orders_incremental
      